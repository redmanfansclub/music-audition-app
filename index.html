        const decodeTaskData = (encoded) => { try { return JSON.parse(decodeURIComponent(atob(encoded))); } catch (e) { return null; } };
        const getStoredAuditions = () => { try { return JSON.parse(localStorage.getItem('audition_app_tasks') || '[]'); } catch (e) { return []; } };
        const saveStoredAuditions = (newList) => { try { localStorage.setItem('audition_app_tasks', JSON.stringify(newList)); } catch (e) {} };
        const getStoredScores = () => { try { return JSON.parse(localStorage.getItem('audition_app_scores') || '[]'); } catch (e) { return []; } };
        const saveStoredScores = (newList) => { try { localStorage.setItem('audition_app_scores', JSON.stringify(newList)); } catch (e) {} };

        const normalizeSearch = (str) => {
            if (!str) return '';
            return String(str)
                .toLowerCase()
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/[º°ª]/g, '')
                .replace(/\s+/g, '')
                .trim();
        };

        const getTaskCodeFromUrl = () => {
            try {
                const params = new URLSearchParams(window.location.search);
                const code = params.get('task');
                if (code) return code;
                const hash = window.location.hash || '';
                if (hash.startsWith('#task/')) return hash.replace('#task/', '');
            } catch (e) {}
            return null;
        };

        const buildStudentUrl = (code) => {
            const base = `${window.location.origin}${window.location.pathname}`;
            return `${base}?task=${encodeURIComponent(code)}`;
        };

        const saveStudentSubmission = (record) => {
            try {
                const list = getStoredScores();
                const filtered = list.filter(r => !(r.student_email?.toLowerCase() === record.student_email?.toLowerCase() && r.audition_id === record.audition_id));
                localStorage.setItem('audition_app_scores', JSON.stringify([record, ...filtered]));
            } catch (e) {}
        };

        const extractYouTubeId = (url) => {
            if (!url) return null;
            const trimmed = String(url).trim();
            if (!trimmed) return null;
            if (/^[a-zA-Z0-9_-]{11}$/.test(trimmed)) return trimmed;
            const regExp = /(?:https?:\/\/)?(?:[a-zA-Z0-9-]+\.)?(?:youtube(?:-nocookie)?\.com\/(?:[^\/\n\s]+\/\S+\/|(?:v|e(?:mbed)?|shorts|live)\/|\S*?[?&]v=)|youtu\.be\/)([a-zA-Z0-9_-]{11})/;
            const match = trimmed.match(regExp);
            return match ? match[1] : null;
        };

        const getEnglishFeedback = (score) => {
            const num = Number(score);
            if (num >= 9) return { title: "Outstanding Achievement", text: "Outstanding work! You have shown an excellent understanding of the musical vocabulary in this audition. Your effort and attention to detail have paid off. Keep up the fantastic work!" };
            if (num >= 7) return { title: "Good Work", text: "Well done! You have achieved a good result and demonstrated a solid understanding of most of the content. With a little more effort and attention to detail, you can reach an excellent level. Keep it up!" };
            if (num >= 5) return { title: "Satisfactory Performance", text: "You have passed, but you can do much better. Your understanding is still basic, and you need to work harder to improve your knowledge and accuracy. Do not settle for the minimum!" };
            if (num >= 3) return { title: "Poor Result", text: "This result is disappointing and not good enough. You have made too many mistakes and need to take your learning much more seriously. I expect a clear improvement in your next audition." };
            return { title: "Very Poor Result", text: "This result is unacceptable. You have shown very little understanding of the content assessed. I am seriously disappointed and expect much more effort, preparation and commitment from you." };
        };

        const standardStudentClasses = ['2º ESO A', '2º ESO B', '2º ESO C', '3º ESO A', '3º ESO B', '3º ESO C'];
        const classSearchMatch = (studentClass, query) => {
            const raw = String(studentClass || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[º°ª.]/g, '').replace(/\s+/g, '');
            const q = String(query || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[º°ª.]/g, '').replace(/\s+/g, '');
            if (!q) return false;
            const match = raw.match(/^(\d+)(?:eso|curso|bachillerato|bach)?([a-z]*)/);
            if (!match) return raw.includes(q);
            const level = match[1];
            const group = match[2] || '';
            if (/^[1-3]$/.test(q)) return level === q;
            if (/^[a-z]$/.test(q)) return group.includes(q);
            const parsed = q.match(/^(\d+)(?:eso|curso|bachillerato|bach)?([a-z]*)$/);
            if (parsed) {
                if (level !== parsed[1]) return false;
                const requestedGroups = parsed[2] || '';
                if (!requestedGroups) return true;
                return requestedGroups.split('').some(letter => group.includes(letter));
            }
            return raw.includes(q);
        };

        const getQRBase64 = async (text) => {
            if (!text) return null;
            try {
                const url = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=5&data=${encodeURIComponent(text)}`;
                const response = await fetch(url);
                if (!response.ok) return null;
                const blob = await response.blob();
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result);
                    reader.onerror = () => resolve(null);
                    reader.readAsDataURL(blob);
                });
            } catch (e) {
                console.error("QR generation error:", e);
                return null;
            }
        };

        const playAudioFeedback = (type, score = 10) => {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const now = ctx.currentTime;
                const numScore = Number(score);
                if (type === 'success' && numScore >= 8) {
                    const notes = [{ f: 523.25, t: 0.0, d: 0.15 }, { f: 659.25, t: 0.12, d: 0.15 }, { f: 783.99, t: 0.24, d: 0.15 }, { f: 1046.50, t: 0.36, d: 0.30 }, { f: 783.99, t: 0.60, d: 0.15 }, { f: 1046.50, t: 0.72, d: 0.18 }, { f: 1318.51, t: 0.90, d: 0.22 }, { f: 1567.98, t: 1.12, d: 0.50 }];
                    notes.forEach((note) => {
                        const osc = ctx.createOscillator(); const gain = ctx.createGain();
                        osc.type = 'triangle'; osc.frequency.setValueAtTime(note.f, now + note.t);
                        gain.gain.setValueAtTime(0.18, now + note.t);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + note.t + note.d);
                        osc.connect(gain); gain.connect(ctx.destination);
                        osc.start(now + note.t); osc.stop(now + note.t + note.d);
                    });
                } else if (type === 'success' && numScore >= 7) {
                    const arpeggio = [{ f: 392.00, t: 0.00, d: 0.22 }, { f: 493.88, t: 0.17, d: 0.22 }, { f: 587.33, t: 0.34, d: 0.22 }, { f: 659.25, t: 0.51, d: 0.25 }, { f: 587.33, t: 0.74, d: 0.22 }, { f: 493.88, t: 0.91, d: 0.22 }, { f: 587.33, t: 1.08, d: 0.22 }, { f: 783.99, t: 1.25, d: 0.50 }];
                    arpeggio.forEach((note) => {
                        const osc = ctx.createOscillator(); const gain = ctx.createGain();
                        osc.type = 'sine'; osc.frequency.setValueAtTime(note.f, now + note.t);
                        gain.gain.setValueAtTime(0.15, now + note.t);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + note.t + note.d);
                        osc.connect(gain); gain.connect(ctx.destination);
                        osc.start(now + note.t); osc.stop(now + note.t + note.d);
                    });
                } else if (type === 'success' && numScore >= 5) {
                    const gentle = [{f:523.25,t:0,d:0.18},{f:659.25,t:0.2,d:0.2},{f:587.33,t:0.43,d:0.22},{f:659.25,t:0.68,d:0.38}];
                    gentle.forEach(note => { const osc=ctx.createOscillator(); const gain=ctx.createGain(); osc.type='sine'; osc.frequency.setValueAtTime(note.f,now+note.t); gain.gain.setValueAtTime(0.10,now+note.t); gain.gain.exponentialRampToValueAtTime(0.001,now+note.t+note.d); osc.connect(gain); gain.connect(ctx.destination); osc.start(now+note.t); osc.stop(now+note.t+note.d); });
                } else {
                    const suspenseSequence = [{ f: 246.94, t: 0.00, d: 0.30 }, { f: 233.08, t: 0.28, d: 0.30 }, { f: 220.00, t: 0.56, d: 0.45 }, { f: 110.00, t: 1.05, d: 0.35 }, { f: 233.08, t: 1.45, d: 0.35 }, { f: 220.00, t: 1.78, d: 0.35 }, { f: 207.65, t: 2.11, d: 0.60 }];
                    suspenseSequence.forEach((note) => {
                        const osc = ctx.createOscillator(); const gain = ctx.createGain();
                        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(note.f, now + note.t);
                        gain.gain.setValueAtTime(0.14, now + note.t);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + note.t + note.d);
                        osc.connect(gain); gain.connect(ctx.destination);
                        osc.start(now + note.t); osc.stop(now + note.t + note.d);
                    });
                }
            } catch(e) {}

            if (legacy.includes('jazz') || legacy.includes('blues') || legacy.includes('soul')) return MUSIC_THEMES.jazz;

            if (legacy.includes('pop') || legacy.includes('electronic') || legacy.includes('reggae') || legacy.includes('rap')) return MUSIC_THEMES.pop;
            return MUSIC_THEMES.classical;
        };

            useEffect(() => {

                        setView('dashboard');
                        showToast("Signed in successfully.", "success");

            const handlePasswordRecoveryRequest = async () => {

                try {
                    const redirectTo = `${window.location.origin}${window.location.pathname}`;

                    showToast('Password recovery email sent. Open the newest email to continue.', 'success');

                    showToast(error?.message || 'Could not send the recovery email.', 'error');

            const handleSetNewPassword = async (e) => {
                e.preventDefault();
                if (!supabaseClient) { showToast('Cloud connection is unavailable. Please reload and try again.', 'error'); return; }
                if (!session) { showToast('The recovery session is missing. Request a new recovery email.', 'error'); setView('auth'); return; }
                if (recoveryPassword.length < 10) { showToast('Choose a password with at least 10 characters.', 'error'); return; }
                if (recoveryPassword !== recoveryPasswordConfirm) { showToast('The passwords do not match.', 'error'); return; }
                setLoading(true);
                try {
                    const { error } = await supabaseClient.auth.updateUser({ password: recoveryPassword });

                    try { window.history.replaceState(null, '', `${window.location.origin}${window.location.pathname}`); } catch (e) {}
                    setView('dashboard');
                    showToast('Password updated successfully. You can now sign out and sign in with the new password.', 'success');

            const handleLogout = async () => {
                try { await supabaseClient.auth.signOut(); } catch (e) {}
                setSession(null); setView('auth');
                showToast("Signed out.", "info");
            };


            const videoId = useMemo(() => extractYouTubeId(youtubeUrl), [youtubeUrl]);
            const uppercaseWords = useMemo(() => commentText.match(/[A-ZÁÉÍÓÚÑ]{2,}/g) || [], [commentText]);
            const activeMusicTheme = getMusicTheme(activeTask?.style || 'classical');

            const handleHintChange = (idx, value) => {
                const newHints = [...taskHints]; newHints[idx] = value; setTaskHints(newHints);
            };

            const handlePublishTask = async () => {
                if (uppercaseWords.length !== 10) { showToast("You must include exactly 10 UPPERCASE words in the commentary.", "error"); return; }
                if (!videoId) { showToast("Please provide a valid YouTube video URL.", "error"); return; }
                const teacherEmail = session?.user?.email?.toLowerCase().trim();
                if (!teacherEmail) { showToast("Please sign in before publishing.", "error"); setView('auth'); return; }
                if (!supabaseClient) { showToast("No connection to Supabase. The task has not been published.", "error"); return; }
                setLoading(true);
                const taskId = 'aud-' + crypto.randomUUID().replace(/-/g, '').slice(0, 16);
                const taskPayload = {
                    teacher_email: teacherEmail,
                    title: title || 'Untitled Audition',
                    artist: artist || 'Unknown Artist',
                    style: style,
                    youtube_url: youtubeUrl,
                    comment: commentText,
                    uppercase_words: uppercaseWords,

                };
                try {
                    let insertError = null;

                    insertError = firstTry.error;
                    if (insertError && /hints/i.test(insertError.message || '')) {
                        const { hints, ...payloadNoHints } = taskPayload;

            const handleStudentLookup = async (e) => {

            const filteredScores = useMemo(() => {
                return scoresList.filter(s => {
                    const qRaw = String(searchTerm || '').trim();
                    const q = normalizeSearch(qRaw);
                    if (!q) return true;

                    // A lone 1, 2 or 3 prioritises the course; a lone 4 is a score search.
                    if (/^[1-3]$/.test(q)) return classSearchMatch(s.student_class, q);
                    if (q === '4') return String(s.score ?? '').includes(q);
                    // A lone group letter searches that group across all course levels.
                    if (/^[a-d]$/.test(q)) return classSearchMatch(s.student_class, q);
                    // Explicit course/group queries such as 2A, 2 ESO A, 4ESO, 4curso or 4ABC.
                    if (/^\d+(?:eso|curso|bachillerato|bach)?[a-z]*$/.test(q)) {
                        return classSearchMatch(s.student_class, q);
                    }

                    const fields = [
                        normalizeSearch(s.student_name),
                        normalizeSearch(s.student_email),
                        normalizeSearch(s.student_class),
                        normalizeSearch(s.auditions?.title),
                        normalizeSearch(s.auditions?.artist),

                    ];
                    return fields.some(f => f.includes(q));

                        normalizeSearch(a.title),
                        normalizeSearch(a.artist),
                        normalizeSearch(a.share_link)
                    ];
                    return fields.some(f => f.includes(q));

            const stats = useMemo(() => {
                if (filteredScores.length === 0) return null;
                const avg = filteredScores.reduce((acc, s) => acc + Number(s.score || 0), 0) / filteredScores.length;
                const best = filteredScores.reduce((acc, s) => Number(s.score) > Number(acc.score) ? s : acc, filteredScores[0]);
                return { avg: avg.toFixed(2), count: filteredScores.length, bestName: best.student_name, bestScore: Number(best.score).toFixed(1) };
            }, [filteredScores]);

            const parsedParagraphs = useMemo(() => {
                if (!activeTask?.comment) return [];
                let gapCounter = 0;
                const paragraphs = activeTask.comment.split('\n');
                return paragraphs.map((paragraphText) => {
                    if (!paragraphText.trim()) return [];
                    const tokens = []; const regex = /([A-ZÁÉÍÓÚÑ]{2,})/g;
                    let lastIdx = 0; let match;
                    while ((match = regex.exec(paragraphText)) !== null) {
                        if (match.index > lastIdx) tokens.push({ type: 'text', content: paragraphText.slice(lastIdx, match.index) });
                        tokens.push({ type: 'gap', word: match[0], gapIndex: gapCounter++ });
                        lastIdx = regex.lastIndex;
                    }
                    if (lastIdx < paragraphText.length) tokens.push({ type: 'text', content: paragraphText.slice(lastIdx) });
                    return tokens;
                });
            }, [activeTask]);

            const handleStudentAnswerChange = (idx, value) => { setStudentAnswers(prev => ({ ...prev, [idx]: value })); };

                        p_code: activeTask.share_link, p_name: studentName.trim(), p_class: studentClass,
                        p_email: studentEmail.trim().toLowerCase(), p_answers: studentAnswers, p_hints: usedHints
                    });

                    const record = hydrateRecord(data, activeTask);
                    const finalGrade = Number(record.score);

                        playAudioFeedback('success', finalGrade);
                        if (finalGrade >= 8 && window.confetti) confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
                    } else playAudioFeedback('error', finalGrade);
                } finally { setSubmitting(false); }

            const generatePDF = (record) => {
                const { jsPDF } = window.jspdf;
                // Landscape A4 diploma: spacious two-column composition.
                const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });

                                                                <td className="py-3.5 px-4"><p className="font-bold text-slate-950">{s.student_name}</p><p className="text-xs text-slate-400">{s.student_email || 'No email'}</p></td>
                                                                <td className="py-3.5 px-4 font-mono text-xs">{s.student_class}</td><td className="py-3.5 px-4 text-slate-600 font-medium">{s.auditions?.title}</td>
                                                                <td className="py-3.5 px-4 text-center"><span className={`inline-block font-extrabold text-xs px-2.5 py-1 rounded-full ${Number(s.score) >= 8 ? 'bg-emerald-50 text-emerald-700' : Number(s.score) >= 5 ? 'bg-amber-50 text-amber-700' : 'bg-rose-50 text-rose-700'}`}>{Number(s.score).toFixed(1)}/10</span></td>
                                                                <td className="py-3.5 px-4 text-right space-x-1">
                                                                    <button onClick={() => setSelectedScoreDetails(s)} title="View" className="p-2 hover:bg-slate-100 rounded-lg text-slate-500 transition-colors"><Icons.Eye /></button>
                                                                    <button onClick={() => generatePDF(s)} title="Diploma PDF" className="p-2 hover:bg-indigo-50 rounded-lg text-indigo-600 transition-colors"><Icons.Download /></button>
                                                                    <button onClick={() => handleDeleteScore(s.id)} title="Delete" className="p-2 hover:bg-rose-50 rounded-lg text-rose-600 transition-colors"><Icons.Trash /></button>
                                                                </td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}

                        {selectedScoreDetails && (
                            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                                <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl space-y-4">
                                    <div className="flex justify-between items-start">
                                        <div><h3 className="text-lg font-bold text-slate-900">{selectedScoreDetails.student_name}</h3><p className="text-xs text-slate-400">{selectedScoreDetails.student_email || 'N/A'}</p></div>
                                        <span className="text-3xl font-black text-indigo-600">{Number(selectedScoreDetails.score).toFixed(1)}/10</span>
                                    </div>
                                    <div className="space-y-1.5 max-h-56 overflow-y-auto pr-1">
                                        {selectedScoreDetails.details?.words?.map((w, i) => (
                                            <div key={i} className={`flex justify-between p-2.5 rounded-xl border text-xs font-semibold ${w.correct ? 'bg-emerald-50/50 border-emerald-100 text-emerald-800' : 'bg-rose-50/50 border-rose-100 text-rose-800'}`}>
                                                <span>Gap {i + 1}: {w.correct ? (w.usedHint ? "Correct with hint (0.5 pt)" : "Correct (1.0 pt)") : "Incorrect"}</span>
                                                <span className="font-mono">{w.correct ? w.original : (w.answer || '(empty)')}</span>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="flex justify-end pt-4"><button onClick={() => setSelectedScoreDetails(null)} className="bg-slate-100 hover:bg-slate-200 text-slate-600 px-4 py-2 rounded-xl text-sm font-bold transition-all">Close</button></div>
                                </div>
                            </div>
                        )}

                        {view === 'student-test' && !activeTask && (
                            <div className="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-sm border border-rose-200 mt-12 text-center space-y-4">
                                <div className="text-5xl">🔍</div>
                                <h2 className="text-xl font-bold text-slate-900">Task Not Found</h2>
                                <p className="text-sm text-slate-500">We couldn't find the audition task associated with this link.</p>
                                <button onClick={() => { window.location.href = window.location.origin + window.location.pathname; }} className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-5 py-2.5 rounded-xl text-sm">Go to Home</button>
                            </div>
                        )}

                        {view === 'student-test' && activeTask && !examSubmitted && (
                            <div className="max-w-3xl mx-auto space-y-6">
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                    <div><h2 className="text-lg font-bold text-slate-900">Student Identification</h2><p className="text-xs text-slate-500">Please enter your details before taking the audition exam.</p></div>
                                    <button onClick={() => setLookupModal(true)} className="bg-slate-100 hover:bg-slate-200 text-indigo-700 text-xs font-bold px-3 py-2 rounded-xl transition-all flex items-center gap-1.5"><Icons.Eye /> Already completed?</button>
                                </div>
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
                                    <div><label className="block text-[10px] font-bold text-slate-500 uppercase mb-1">Full Name</label><input type="text" placeholder="e.g. Alex Morgan" value={studentName} onChange={e => setStudentName(e.target.value)} className="w-full px-3 py-2 bg-slate-50 border rounded-lg text-sm outline-none focus:border-indigo-500" /></div>
                                    <div>
                                        <label className="block text-[10px] font-bold text-slate-500 uppercase mb-1">Group / Class</label>
                                        <select value={standardStudentClasses.includes(studentClass) ? studentClass : '__custom__'} onChange={e => setStudentClass(e.target.value === '__custom__' ? '' : e.target.value)} className="w-full px-3 py-2 bg-slate-50 border rounded-lg text-sm outline-none focus:border-indigo-500 font-medium">
                                            {standardStudentClasses.map(group => <option key={group} value={group}>{group}</option>)}
                                            <option value="__custom__">Other course or group…</option>
                                        </select>
                                        {!standardStudentClasses.includes(studentClass) && <input type="text" value={studentClass} onChange={e => setStudentClass(e.target.value)} placeholder="e.g. 4º ESO A, 1º Bachillerato" className="w-full mt-2 px-3 py-2 bg-slate-50 border rounded-lg text-sm outline-none focus:border-indigo-500" required aria-label="Custom course or group" />}
                                    </div>
                                    <div><label className="block text-[10px] font-bold text-slate-500 uppercase mb-1">School Email</label><input type="email" placeholder="@alu.murciaeduca.es" value={studentEmail} onChange={e => setStudentEmail(e.target.value)} onBlur={async () => { const already = await checkIfAlreadySubmitted(studentEmail); setAlreadySubmittedWarning(already); }} className="w-full px-3 py-2 bg-slate-50 border rounded-lg text-sm outline-none focus:border-indigo-500" /></div>
                                </div>
                                {alreadySubmittedWarning && (
                                    <div className="bg-amber-50 border border-amber-200 p-4 rounded-2xl text-sm text-amber-900">
                                        <strong>⚠️ Note:</strong> You already submitted this task with this email. If you submit again, your previous score will be replaced.
                                    </div>
                                )}
                                <div className="p-6 md:p-8 rounded-2xl shadow-md border" style={{backgroundColor:activeMusicTheme.colors.paper,borderColor:activeMusicTheme.colors.soft,fontFamily:activeMusicTheme.font}}>
                                    <div className="mb-6 pb-6 border-b flex flex-col md:flex-row gap-6 items-center" style={{borderColor:activeMusicTheme.colors.soft}}>
                                        <div className="flex-1"><div className="text-[10px] font-extrabold uppercase tracking-[0.18em] mb-2" style={{color:activeMusicTheme.colors.accent}}>{activeMusicTheme.icon} {activeMusicTheme.label}</div><h2 className="text-2xl font-extrabold" style={{color:activeMusicTheme.colors.primary}}>{activeTask.title}</h2><p className="font-medium" style={{color:activeMusicTheme.colors.primary,opacity:0.8}}>{activeTask.artist}</p></div>
                                        <div className="w-full md:w-80 shrink-0 rounded-xl overflow-hidden border bg-slate-900 aspect-video relative flex flex-col items-center justify-center">
                                            {(() => {
                                                const studentVideoId = extractYouTubeId(activeTask.youtube_url);
                                                if (studentVideoId) return (<><iframe className="w-full h-full" src={`https://www.youtube-nocookie.com/embed/${studentVideoId}?rel=0`} title="Student Video" frameBorder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowFullScreen></iframe><a href={`https://www.youtube.com/watch?v=${studentVideoId}`} target="_blank" rel="noopener noreferrer" className="absolute bottom-1.5 right-1.5 bg-black/70 hover:bg-black text-white text-[10px] font-bold px-2 py-0.5 rounded-md backdrop-blur-sm flex items-center gap-1 z-10"><Icons.External /> YouTube</a></>);
                                                return (<div className="w-full h-full flex flex-col items-center justify-center text-xs text-slate-500 font-bold p-2 text-center"><span>Video Not Available</span></div>);
                                            })()}
                                        </div>
                                    </div>
                                    
                                    {/* ZONA PROTEGIDA ANTI-COPIA */}
                                    <div className="space-y-6 anti-copy-zone relative">
                                        <div className="absolute inset-0 z-0" title="Text protected"></div>
                                        
                                        {parsedParagraphs.map((paragraphTokens, pIndex) => {
                                            if (paragraphTokens.length === 0) return null;
                                            const paragraphSpeechText = paragraphTokens.map(t => t.type === 'gap' ? ' blank ' : t.content).join('');
                                            return (
                                                <div key={pIndex} className="relative group bg-slate-50 p-5 rounded-xl border pr-12 z-10">
                                                    <button onClick={() => toggleSpeech(paragraphSpeechText, pIndex)} title="Listen in English" className={`absolute top-4 right-4 p-2 rounded-full shadow-sm transition-all ${speakingIndex === pIndex ? 'bg-indigo-600 text-white animate-pulse' : 'bg-white text-indigo-600 border hover:bg-indigo-50'}`}>
                                                        {speakingIndex === pIndex ? <Icons.Stop /> : <Icons.Speaker />}
                                                    </button>
                                                    <p className="text-slate-800 leading-loose text-[15px]">
                                                        {paragraphTokens.map((token, tIndex) => {
                                                            if (token.type === 'text') return <span key={tIndex}>{token.content}</span>;
                                                            const gapIdx = token.gapIndex;
                                                            const hintText = activeTask.hints && activeTask.hints[gapIdx];
                                                            // Use only the safe clue metadata returned by the public Supabase RPC.
                                                            // The visible token may intentionally be masked (e.g. XXXXXXX).
                                                            const safeClues = Array.isArray(activeTask.gap_clues) ? activeTask.gap_clues : [];
                                                            let clue = safeClues[gapIdx];
                                                            if (!clue || !Number.isInteger(Number(clue.len)) || Number(clue.len) < 1) {
                                                                const maskedToken = String(token.word || '').replace(/[^A-ZÁÉÍÓÚÑ]/gi, '').toUpperCase();
                                                                clue = { len: maskedToken.length || 5, first: '', last2: '' };
                                                            }
                                                            const len = Number(clue.len);
                                                            if ([2, 7].includes(gapIdx)) {
                                                                const options = mcOptions[gapIdx] || [];
                                                                return (
                                                                    <span key={tIndex} className="inline-block mx-1 align-bottom">
                                                                        <span className="relative inline-flex flex-col items-center">
                                                                            <select value={studentAnswers[gapIdx] || ''} onChange={e => handleStudentAnswerChange(gapIdx, e.target.value)} className="px-2 py-1 text-center border-b-2 border-indigo-500 shadow-md font-bold text-indigo-800 uppercase outline-none text-sm bg-white rounded-t cursor-pointer transition-shadow focus:shadow-lg" style={{width: `${Math.max(12, ...options.map(opt => String(opt || '').length * 1.35 + 4))}ch`, maxWidth: 'min(88vw, 42ch)', boxSizing: 'border-box', fontFamily: 'Arial, Helvetica, sans-serif', fontWeight: 600, letterSpacing: '0.01em'}}>
                                                                                <option value="" disabled>Select...</option>
                                                                                {options.map((opt, i) => <option key={i} value={opt}>{opt}</option>)}
                                                                            </select>
                                                                            {hintText && (<button onClick={() => setUsedHints({...usedHints, [gapIdx]: true})} className="mt-1 text-[10px] bg-amber-100 hover:bg-amber-200 text-amber-900 px-2 py-0.5 font-bold rounded-md whitespace-nowrap flex items-center gap-1 shadow-sm"><Icons.Lightbulb />{usedHints[gapIdx] ? `Hint: ${hintText}` : "Hint (-0.5 pt)"}</button>)}
                                                                        </span>
                                                                    </span>
                                                                );
                                                            } else {
                                                                // Render separated character positions so the clue remains legible.
                                                                // The answer itself remains protected; only safeClues supplies visible letters.
                                                                let clueDisplay = `Gap ${gapIdx + 1}`;
                                                                if ([0, 4, 6, 8].includes(gapIdx)) {
                                                                    clueDisplay = [clue.first || '', ...Array(Math.max(0, len - 1)).fill('_')].join(' ');
                                                                } else if ([1, 3, 5, 9].includes(gapIdx)) {
                                                                    clueDisplay = [...Array(Math.max(0, len - 2)).fill('_'), ...(String(clue.last2 || '').split(''))].join(' ');
                                                                }
                                                                const answerLength = String(studentAnswers[gapIdx] || '').length;
                                                                // Generous width: approx. two character units per target letter + side padding.
                                                                const fieldWidthCh = Math.max(8, len * 2 + 2, answerLength * 1.8 + 2, clueDisplay.length * 0.9 + 2);
                                                                return (
                                                                    <span key={tIndex} className="inline-block mx-1 align-bottom max-w-full">
                                                                        <span className="relative inline-flex max-w-full flex-col items-center align-bottom">
                                                                            <input type="text" aria-label={`Answer for gap ${gapIdx + 1}`} placeholder={clueDisplay} value={studentAnswers[gapIdx] || ''} onChange={e => handleStudentAnswerChange(gapIdx, e.target.value)} size={Math.max(8, len * 2, answerLength * 2)} className="px-3 py-1.5 text-center border-b-2 border-indigo-500 shadow-md font-semibold text-indigo-800 uppercase outline-none text-sm bg-white rounded-t placeholder-slate-500 transition-shadow focus:shadow-lg" style={{ width: `${fieldWidthCh}ch`, maxWidth: 'min(88vw, 42ch)', boxSizing: 'border-box', letterSpacing: '0.04em', fontFamily: 'Arial, Helvetica, sans-serif', fontWeight: 600 }} />
                                                                            {hintText && (<button onClick={() => setUsedHints({...usedHints, [gapIdx]: true})} className="mt-1 text-[10px] bg-amber-100 hover:bg-amber-200 text-amber-900 px-2 py-0.5 font-semibold rounded-md whitespace-nowrap flex items-center gap-1 shadow-sm"><Icons.Lightbulb />{usedHints[gapIdx] ? `Hint: ${hintText}` : "Hint (-0.5 pt)"}</button>)}
                                                                        </span>
                                                                    </span>
                                                                );
                                                            }
                                                        })}
                                                    </p>
                                                </div>
                                            );
                                        })}
                                    </div>
                                    <button onClick={handleEvaluation} disabled={!studentName || !studentEmail || submitting} className={`w-full mt-10 font-bold py-4 rounded-xl shadow-md text-base transition-all ${(studentName && studentEmail && !submitting) ? 'bg-indigo-600 text-white hover:bg-indigo-700' : 'bg-slate-300 text-slate-500 cursor-not-allowed'}`}>{submitting ? 'Submitting...' : 'Submit Audition Assessment'}</button>
                                </div>
                            </div>
                        )}

                        {/* AVISO DE ABANDONO DE PESTAÑA */}
                        {showAwayWarning && (
                            <div className="fixed inset-0 bg-rose-900/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
                                <div className="bg-white rounded-2xl p-8 max-w-lg w-full shadow-2xl border-4 border-rose-500 text-center space-y-4">
                                    <div className="text-5xl">⚠️</div>
                                    <h3 className="text-2xl font-black text-rose-700">Focus Alert!</h3>
                                    <p className="text-slate-700 font-medium">We have detected that you left the task. Remember this is for your own learning.</p>
                                    <p className="text-slate-600 text-sm">You are welcome to review previous auditions in Classroom or use a dictionary (WordReference or DeepL) to look up vocabulary.</p>
                                    <p className="text-rose-700 font-bold bg-rose-50 p-3 rounded-xl text-sm">However, you must not use AI tools to find the answers. This won't help you learn and will only harm your own progress.</p>
                                    <button onClick={() => setShowAwayWarning(false)} className="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3.5 rounded-xl text-sm mt-4">Return to the task</button>
                                </div>
                            </div>
                        )}

                        {view === 'results' && finalScoreRecord && (
                            <div className="max-w-2xl mx-auto p-8 md:p-10 rounded-3xl shadow-xl border text-center relative overflow-hidden" style={{backgroundColor:getMusicTheme(finalScoreRecord.taskDetails?.style || finalScoreRecord.auditions?.style || 'classical').colors.paper, borderColor:getMusicTheme(finalScoreRecord.taskDetails?.style || finalScoreRecord.auditions?.style || 'classical').colors.accent}}>
                                {(() => {
                                    const feedback = getEnglishFeedback(finalScoreRecord.score);
                                    return (
                                        <div className="relative z-10 space-y-6">
                                            <div>
                                                <div className="w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 border-4 border-white shadow-sm" style={{backgroundColor:getMusicTheme(finalScoreRecord.taskDetails?.style || finalScoreRecord.auditions?.style || 'classical').colors.soft,color:getMusicTheme(finalScoreRecord.taskDetails?.style || finalScoreRecord.auditions?.style || 'classical').colors.primary}}><span className="text-4xl">{getMusicTheme(finalScoreRecord.taskDetails?.style || finalScoreRecord.auditions?.style || 'classical').icon}</span></div>
                                                <h2 className="text-3xl font-bold mb-1" style={{color:getMusicTheme(finalScoreRecord.taskDetails?.style || finalScoreRecord.auditions?.style || 'classical').colors.primary,fontFamily:getMusicTheme(finalScoreRecord.taskDetails?.style || finalScoreRecord.auditions?.style || 'classical').font}}>Assessment Submitted</h2>
                                                <p className="text-xs text-slate-400">{finalScoreRecord.student_name} ({finalScoreRecord.student_class})</p>
                                            </div>
                                            <div className="border-2 px-8 py-6 rounded-3xl inline-block mx-auto shadow-sm" style={{backgroundColor:getMusicTheme(finalScoreRecord.taskDetails?.style || finalScoreRecord.auditions?.style || 'classical').colors.primary,borderColor:getMusicTheme(finalScoreRecord.taskDetails?.style || finalScoreRecord.auditions?.style || 'classical').colors.accent}}>
                                                <span className="block text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-2">FINAL SCORE</span>
                                                <span className="text-7xl font-black tracking-tighter" style={{color:'#FFFFFF'}}>{Number(finalScoreRecord.score).toFixed(1)} <span className="text-3xl text-white/70 font-medium">/ 10</span></span>
                                            </div>
                                            <div className="border p-6 rounded-2xl text-left shadow-sm" style={{backgroundColor:getMusicTheme(finalScoreRecord.taskDetails?.style || finalScoreRecord.auditions?.style || 'classical').colors.soft,borderColor:getMusicTheme(finalScoreRecord.taskDetails?.style || finalScoreRecord.auditions?.style || 'classical').colors.accent}}>
                                                <span className="text-[10px] font-bold uppercase tracking-wider block mb-1" style={{color:getMusicTheme(finalScoreRecord.taskDetails?.style || finalScoreRecord.auditions?.style || 'classical').colors.primary}}>Pedagogy Evaluation</span>
                                                <h4 className="text-lg font-semibold mb-1" style={{color:getMusicTheme(finalScoreRecord.taskDetails?.style || finalScoreRecord.auditions?.style || 'classical').colors.primary,fontFamily:getMusicTheme(finalScoreRecord.taskDetails?.style || finalScoreRecord.auditions?.style || 'classical').font}}>{feedback.title}</h4>
                                                <p className="text-slate-600 text-sm leading-relaxed">{feedback.text}</p>
                                            </div>
                                            <div className="text-left p-5 rounded-2xl border space-y-3" style={{backgroundColor:getMusicTheme(finalScoreRecord.taskDetails?.style || finalScoreRecord.auditions?.style || 'classical').colors.soft,borderColor:getMusicTheme(finalScoreRecord.taskDetails?.style || finalScoreRecord.auditions?.style || 'classical').colors.accent}}>
                                                <h4 className="font-bold text-slate-800 text-sm">Your Vocabulary Results</h4>
                                                <p className="text-xs text-slate-500">Green words were correct. Red words need more practice. Correct answers are not displayed.</p>
                                                <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                                                    {(finalScoreRecord.details?.words || []).map((item, idx) => (
                                                        <div key={idx} className={`px-3 py-2 rounded-lg border text-xs font-semibold ${item.correct ? 'bg-emerald-50 border-emerald-200 text-emerald-800' : 'bg-rose-50 border-rose-200 text-rose-800'}`}>
                                                            <span className="opacity-60 mr-1">{String(idx + 1).padStart(2, '0')}.</span>{String(item.original || `Word ${idx + 1}`).toUpperCase()}
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                            <div className="space-y-3 pt-2">
                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                                    <button onClick={() => generatePDF(finalScoreRecord)} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl text-sm flex items-center justify-center gap-2 shadow-md"><Icons.Download /> Download Diploma PDF</button>
                                                    <a href="https://classroom.google.com" target="_blank" rel="noopener noreferrer" className="w-full bg-white border font-bold py-3.5 rounded-xl text-sm flex items-center justify-center gap-2 text-slate-700 shadow-sm hover:bg-slate-50"><Icons.External /> Open Google Classroom</a>
                                                </div>
                                            </div>
                                            <div className="p-4 rounded-2xl text-left space-y-2 shadow-md border-2" style={{backgroundColor:getMusicTheme(finalScoreRecord.taskDetails?.style || finalScoreRecord.auditions?.style || 'classical').colors.primary,borderColor:getMusicTheme(finalScoreRecord.taskDetails?.style || finalScoreRecord.auditions?.style || 'classical').colors.accent,color:'#FFFFFF'}}>
                                                <h4 className="font-extrabold text-xs flex items-center gap-1.5 uppercase tracking-wide text-white"><Icons.Camera /> Important: Submit your work</h4>
                                                <p className="text-white text-xs leading-relaxed">Before leaving this page, take a screenshot of your results, download your diploma as a PDF, and upload both files to your Google Classroom assignment.</p>
                                            </div>
                                            <div className="pt-2 border-t flex justify-between items-center text-xs text-slate-400">
                                                <button onClick={fetchHistoryAndScores} className="hover:text-slate-600 flex items-center gap-1"><Icons.Refresh /> Check Status Update</button>
                                                <button onClick={() => { setExamSubmitted(false); setView('student-test'); }} className="hover:text-slate-600">Back to Task View</button>
                                            </div>
                                        </div>
                                    );
                                })()}
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
