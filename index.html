        const decodeTaskData = (encoded) => { try { return JSON.parse(decodeURIComponent(atob(encoded))); } catch (e) { return null; } };
        const getStoredAuditions = () => { try { return JSON.parse(localStorage.getItem('audition_app_tasks') || '[]'); } catch (e) { return []; } };

        const saveStoredScores = (newList) => { try { localStorage.setItem('audition_app_scores', JSON.stringify(newList)); } catch (e) {} };

        const normalizeSearch = (str) => {
            if (!str) return '';
            return String(str)
                .toLowerCase()
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .replace(/[º°ª]/g, '')
                .replace(/\s+/g, '')
                .trim();
        };

        const getTaskCodeFromUrl = () => {
            try {
                const params = new URLSearchParams(window.location.search);
                const code = params.get('task');
                if (code) return code;
                const hash = window.location.hash || '';
                if (hash.startsWith('#task/')) return hash.replace('#task/', '');
            } catch (e) {}
            return null;
        };

        const buildStudentUrl = (code) => {
            const base = `${window.location.origin}${window.location.pathname}`;

        const extractYouTubeId = (url) => {
            if (!url) return null;
            const trimmed = String(url).trim();
            if (!trimmed) return null;
            if (/^[a-zA-Z0-9_-]{11}$/.test(trimmed)) return trimmed;
            const regExp = /(?:https?:\/\/)?(?:[a-zA-Z0-9-]+\.)?(?:youtube(?:-nocookie)?\.com\/(?:[^\/\n\s]+\/\S+\/|(?:v|e(?:mbed)?|shorts|live)\/|\S*?[?&]v=)|youtu\.be\/)([a-zA-Z0-9_-]{11})/;
            const match = trimmed.match(regExp);
            return match ? match[1] : null;
        };

        const getEnglishFeedback = (score) => {
            const num = Number(score);

        const getQRBase64 = async (text) => {
            if (!text) return null;
            try {
                const url = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=5&data=${encodeURIComponent(text)}`;
                const response = await fetch(url);
                if (!response.ok) return null;
                const blob = await response.blob();
                return new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result);
                    reader.onerror = () => resolve(null);
                    reader.readAsDataURL(blob);
                });
            } catch (e) {
                console.error("QR generation error:", e);
                return null;
            }
        };

        const playAudioFeedback = (type, score = 10) => {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const now = ctx.currentTime;
                const numScore = Number(score);
                if (type === 'success' && numScore >= 8) {
                    const notes = [{ f: 523.25, t: 0.0, d: 0.15 }, { f: 659.25, t: 0.12, d: 0.15 }, { f: 783.99, t: 0.24, d: 0.15 }, { f: 1046.50, t: 0.36, d: 0.30 }, { f: 783.99, t: 0.60, d: 0.15 }, { f: 1046.50, t: 0.72, d: 0.18 }, { f: 1318.51, t: 0.90, d: 0.22 }, { f: 1567.98, t: 1.12, d: 0.50 }];
                    notes.forEach((note) => {
                        const osc = ctx.createOscillator(); const gain = ctx.createGain();
                        osc.type = 'triangle'; osc.frequency.setValueAtTime(note.f, now + note.t);
                        gain.gain.setValueAtTime(0.18, now + note.t);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + note.t + note.d);
                        osc.connect(gain); gain.connect(ctx.destination);
                        osc.start(now + note.t); osc.stop(now + note.t + note.d);
                    });
                } else if (type === 'success' && numScore >= 5) {
                    const arpeggio = [{ f: 392.00, t: 0.00, d: 0.20 }, { f: 493.88, t: 0.15, d: 0.20 }, { f: 587.33, t: 0.30, d: 0.20 }, { f: 493.88, t: 0.45, d: 0.20 }, { f: 392.00, t: 0.60, d: 0.20 }, { f: 493.88, t: 0.75, d: 0.20 }, { f: 587.33, t: 0.90, d: 0.20 }, { f: 392.00, t: 1.10, d: 0.45 }];
                    arpeggio.forEach((note) => {
                        const osc = ctx.createOscillator(); const gain = ctx.createGain();
                        osc.type = 'sine'; osc.frequency.setValueAtTime(note.f, now + note.t);
                        gain.gain.setValueAtTime(0.15, now + note.t);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + note.t + note.d);
                        osc.connect(gain); gain.connect(ctx.destination);
                        osc.start(now + note.t); osc.stop(now + note.t + note.d);
                    });
                } else {
                    const suspenseSequence = [{ f: 246.94, t: 0.00, d: 0.30 }, { f: 233.08, t: 0.28, d: 0.30 }, { f: 220.00, t: 0.56, d: 0.45 }, { f: 110.00, t: 1.05, d: 0.35 }, { f: 233.08, t: 1.45, d: 0.35 }, { f: 220.00, t: 1.78, d: 0.35 }, { f: 207.65, t: 2.11, d: 0.60 }];
                    suspenseSequence.forEach((note) => {
                        const osc = ctx.createOscillator(); const gain = ctx.createGain();
                        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(note.f, now + note.t);
                        gain.gain.setValueAtTime(0.14, now + note.t);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + note.t + note.d);
                        osc.connect(gain); gain.connect(ctx.destination);
                        osc.start(now + note.t); osc.stop(now + note.t + note.d);
                    });
                }
            } catch(e) {}
        };

        const hydrateRecord = (r, task) => ({ ...r, taskDetails: { ...task, comment: r.full_comment, uppercase_words: (r.details?.words || []).map(w => w.original) } });

            const [activeTask, setActiveTask] = useState(null);
            const [studentName, setStudentName] = useState('');

            const [mcOptions, setMcOptions] = useState({});
            const [speakingIndex, setSpeakingIndex] = useState(null);

            // SISTEMA ANTI-COPIA Y AVISO DE PESTAÑA
            useEffect(() => {
                if (view !== 'student-test' || examSubmitted) return;

                const handleCopy = (e) => {
                    e.preventDefault();
                    showToast("⚠️ Text protection enabled. Use a dictionary or your Classroom notes to find the answers.", "error");
                };
                
                const handleContextMenu = (e) => {
                    e.preventDefault();
                    showToast("⚠️ Right-click disabled. The text is protected.", "error");
                };

                const handleVisibilityChange = () => {
                    if (document.hidden && view === 'student-test' && !examSubmitted && activeTask) {
                        setShowAwayWarning(true);
                    }
                };

                document.addEventListener('copy', handleCopy);
                document.addEventListener('contextmenu', handleContextMenu);
                document.addEventListener("visibilitychange", handleVisibilityChange);

                return () => {
                    document.removeEventListener('copy', handleCopy);
                    document.removeEventListener('contextmenu', handleContextMenu);
                    document.removeEventListener("visibilitychange", handleVisibilityChange);
                };
            }, [view, examSubmitted, activeTask]);

            useEffect(() => {
                if (darkMode) document.body.classList.add('dark');
                else document.body.classList.remove('dark');
                localStorage.setItem('audition_dark_mode', darkMode);
            }, [darkMode]);

            const showToast = (message, type = 'info') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 5000);
            };

            const copyToClipboard = (text) => {
                const tempInput = document.createElement("input");
                tempInput.value = text;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand("copy");
                document.body.removeChild(tempInput);
            };

            useEffect(() => {
                if (supabaseUrl && supabaseKey && window.supabase) {
                    try {
                        const client = window.supabase.createClient(supabaseUrl, supabaseKey);

                    } catch (e) {

            const toggleSpeech = (text, index) => {
                if ('speechSynthesis' in window) {
                    if (speakingIndex === index) { window.speechSynthesis.cancel(); setSpeakingIndex(null); }
                    else {
                        window.speechSynthesis.cancel();
                        const cleanText = text.replace(/[A-ZÁÉÍÓÚÑ]{2,}/g, (m) => m.toLowerCase());
                        const utterance = new SpeechSynthesisUtterance(cleanText);
                        utterance.lang = 'en-US'; utterance.rate = 0.9;
                        const voices = window.speechSynthesis.getVoices();
                        const englishVoice = voices.find(v => v.lang.startsWith('en-US') || v.lang.startsWith('en-GB') || v.lang.startsWith('en'));
                        if (englishVoice) utterance.voice = englishVoice;
                        utterance.onend = () => setSpeakingIndex(null);
                        utterance.onerror = () => setSpeakingIndex(null);

                                            <h2 className="text-xl font-bold text-slate-900">Your Students' Grades & Submissions</h2>
                                            <div className="flex gap-2 w-full sm:w-auto">
                                                <div className="relative flex-1 sm:w-72"><span className="absolute left-3 top-2.5 text-slate-400"><Icons.Search /></span><input type="text" placeholder="Search name, class, email, score..." value={searchTerm} onChange={e => setSearchTerm(e.target.value)} className="w-full pl-9 pr-4 py-2 border rounded-xl text-sm bg-slate-50 outline-none focus:ring-1 focus:ring-indigo-500" /></div>
                                                {scoresList.length > 0 && (
                                                    <button onClick={handleDeleteAllScores} className="px-3 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold flex items-center gap-1 whitespace-nowrap" title="Delete ALL student records">
                                                        <Icons.Trash /> <span className="hidden sm:inline">Delete ALL</span>
                                                    </button>
                                                )}
                                            </div>
                                        </div>
                                        {filteredScores.length === 0 ? ( <p className="text-slate-400 text-center py-10">No student submissions match your search.</p> ) : (
                                            <div className="overflow-x-auto">
                                                <table className="w-full text-left text-sm border-collapse">
                                                    <thead>
                                                        <tr className="border-b text-slate-400 text-xs uppercase bg-slate-50/50"><th className="py-3.5 px-4">Student</th><th className="py-3.5 px-4">Class</th><th className="py-3.5 px-4">Audition Task</th><th className="py-3.5 px-4 text-center">Score</th><th className="py-3.5 px-4 text-right">Actions</th></tr>
                                                    </thead>
                                                    <tbody>
                                                        {filteredScores.map(s => (
                                                            <tr key={s.id} className="border-b border-slate-100 hover:bg-slate-50/30 transition-colors">
                                                                <td className="py-3.5 px-4"><p className="font-bold text-slate-950">{s.student_name}</p><p className="text-xs text-slate-400">{s.student_email || 'No email'}</p></td>
                                                                <td className="py-3.5 px-4 font-mono text-xs">{s.student_class}</td><td className="py-3.5 px-4 text-slate-600 font-medium">{s.auditions?.title}</td>
                                                                <td className="py-3.5 px-4 text-center"><span className={`inline-block font-extrabold text-xs px-2.5 py-1 rounded-full ${Number(s.score) >= 8 ? 'bg-emerald-50 text-emerald-700' : Number(s.score) >= 5 ? 'bg-amber-50 text-amber-700' : 'bg-rose-50 text-rose-700'}`}>{Number(s.score).toFixed(1)}/10</span></td>
                                                                <td className="py-3.5 px-4 text-right space-x-1">
                                                                    <button onClick={() => setSelectedScoreDetails(s)} title="View" className="p-2 hover:bg-slate-100 rounded-lg text-slate-500 transition-colors"><Icons.Eye /></button>
                                                                    <button onClick={() => generatePDF(s)} title="Diploma PDF" className="p-2 hover:bg-indigo-50 rounded-lg text-indigo-600 transition-colors"><Icons.Download /></button>
                                                                    <button onClick={() => handleDeleteScore(s.id)} title="Delete" className="p-2 hover:bg-rose-50 rounded-lg text-rose-600 transition-colors"><Icons.Trash /></button>
                                                                </td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}

                        {selectedScoreDetails && (
                            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                                <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl space-y-4">
                                    <div className="flex justify-between items-start">
                                        <div><h3 className="text-lg font-bold text-slate-900">{selectedScoreDetails.student_name}</h3><p className="text-xs text-slate-400">{selectedScoreDetails.student_email || 'N/A'}</p></div>
                                        <span className="text-3xl font-black text-indigo-600">{Number(selectedScoreDetails.score).toFixed(1)}/10</span>
                                    </div>
                                    <div className="space-y-1.5 max-h-56 overflow-y-auto pr-1">
                                        {selectedScoreDetails.details?.words?.map((w, i) => (
                                            <div key={i} className={`flex justify-between p-2.5 rounded-xl border text-xs font-semibold ${w.correct ? 'bg-emerald-50/50 border-emerald-100 text-emerald-800' : 'bg-rose-50/50 border-rose-100 text-rose-800'}`}>
                                                <span>Gap {i + 1}: {w.correct ? (w.usedHint ? "Correct with hint (0.5 pt)" : "Correct (1.0 pt)") : "Incorrect"}</span>
                                                <span className="font-mono">{w.correct ? w.original : (w.answer || '(empty)')}</span>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="flex justify-end pt-4"><button onClick={() => setSelectedScoreDetails(null)} className="bg-slate-100 hover:bg-slate-200 text-slate-600 px-4 py-2 rounded-xl text-sm font-bold transition-all">Close</button></div>
                                </div>
                            </div>
                        )}

                        {view === 'student-test' && !activeTask && (
                            <div className="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-sm border border-rose-200 mt-12 text-center space-y-4">
                                <div className="text-5xl">🔍</div>
                                <h2 className="text-xl font-bold text-slate-900">Task Not Found</h2>
                                <p className="text-sm text-slate-500">We couldn't find the audition task associated with this link.</p>
                                <button onClick={() => { window.location.href = window.location.origin + window.location.pathname; }} className="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-5 py-2.5 rounded-xl text-sm">Go to Home</button>
                            </div>
                        )}

                        {view === 'student-test' && activeTask && !examSubmitted && (
                            <div className="max-w-3xl mx-auto space-y-6">
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                                    <div><h2 className="text-lg font-bold text-slate-900">Student Identification</h2><p className="text-xs text-slate-500">Please enter your details before taking the audition exam.</p></div>
                                    <button onClick={() => setLookupModal(true)} className="bg-slate-100 hover:bg-slate-200 text-indigo-700 text-xs font-bold px-3 py-2 rounded-xl transition-all flex items-center gap-1.5"><Icons.Eye /> Already completed?</button>
                                </div>
                                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
                                    <div><label className="block text-[10px] font-bold text-slate-500 uppercase mb-1">Full Name</label><input type="text" placeholder="e.g. Alex Morgan" value={studentName} onChange={e => setStudentName(e.target.value)} className="w-full px-3 py-2 bg-slate-50 border rounded-lg text-sm outline-none focus:border-indigo-500" /></div>
                                    <div>
                                        <label className="block text-[10px] font-bold text-slate-500 uppercase mb-1">Group / Class</label>
                                        <select value={studentClass} onChange={e => setStudentClass(e.target.value)} className="w-full px-3 py-2 bg-slate-50 border rounded-lg text-sm outline-none focus:border-indigo-500 font-medium">
                                            <option value="2º ESO A">2º ESO A</option><option value="2º ESO B">2º ESO B</option><option value="2º ESO C">2º ESO C</option>
                                            <option value="3º ESO A">3º ESO A</option><option value="3º ESO B">3º ESO B</option><option value="3º ESO C">3º ESO C</option>
                                        </select>
                                    </div>
                                    <div><label className="block text-[10px] font-bold text-slate-500 uppercase mb-1">School Email</label><input type="email" placeholder="@alu.murciaeduca.es" value={studentEmail} onChange={e => setStudentEmail(e.target.value)} onBlur={async () => { const already = await checkIfAlreadySubmitted(studentEmail); setAlreadySubmittedWarning(already); }} className="w-full px-3 py-2 bg-slate-50 border rounded-lg text-sm outline-none focus:border-indigo-500" /></div>
                                </div>
                                {alreadySubmittedWarning && (
                                    <div className="bg-amber-50 border border-amber-200 p-4 rounded-2xl text-sm text-amber-900">
                                        <strong>⚠️ Note:</strong> You already submitted this task with this email. If you submit again, your previous score will be replaced.
                                    </div>
                                )}
                                <div className="bg-white p-6 md:p-8 rounded-2xl shadow-md border border-slate-200">
                                    <div className="mb-6 pb-6 border-b flex flex-col md:flex-row gap-6 items-center">
                                        <div className="flex-1"><h2 className="text-2xl font-extrabold text-slate-900">{activeTask.title}</h2><p className="text-indigo-600 font-medium">{activeTask.artist}</p></div>
                                        <div className="w-full md:w-72 shrink-0 rounded-xl overflow-hidden border bg-slate-900 aspect-video relative flex flex-col items-center justify-center">
                                            {(() => {
                                                const studentVideoId = extractYouTubeId(activeTask.youtube_url);
                                                if (studentVideoId) return (<><iframe className="w-full h-full" src={`https://www.youtube.com/embed/${studentVideoId}?rel=0&enablejsapi=1`} title="Student Video" frameBorder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowFullScreen></iframe><a href={`https://www.youtube.com/watch?v=${studentVideoId}`} target="_blank" rel="noopener noreferrer" className="absolute bottom-1.5 right-1.5 bg-black/70 hover:bg-black text-white text-[10px] font-bold px-2 py-0.5 rounded-md backdrop-blur-sm flex items-center gap-1 z-10"><Icons.External /> YouTube</a></>);
                                                return (<div className="w-full h-full flex flex-col items-center justify-center text-xs text-slate-500 font-bold p-2 text-center"><span>Video Not Available</span></div>);
                                            })()}
                                        </div>
                                    </div>
                                    
                                    {/* ZONA PROTEGIDA ANTI-COPIA */}
                                    <div className="space-y-6 anti-copy-zone relative">
                                        <div className="absolute inset-0 z-0" title="Text protected"></div>
                                        
                                        {parsedParagraphs.map((paragraphTokens, pIndex) => {
                                            if (paragraphTokens.length === 0) return null;
                                            const paragraphSpeechText = paragraphTokens.map(t => t.type === 'gap' ? ' blank ' : t.content).join('');
                                            return (
                                                <div key={pIndex} className="relative group bg-slate-50 p-5 rounded-xl border pr-12 z-10">
                                                    <button onClick={() => toggleSpeech(paragraphSpeechText, pIndex)} title="Listen in English" className={`absolute top-4 right-4 p-2 rounded-full shadow-sm transition-all ${speakingIndex === pIndex ? 'bg-indigo-600 text-white animate-pulse' : 'bg-white text-indigo-600 border hover:bg-indigo-50'}`}>
                                                        {speakingIndex === pIndex ? <Icons.Stop /> : <Icons.Speaker />}
                                                    </button>
                                                    <p className="text-slate-800 leading-loose text-[15px]">
                                                        {paragraphTokens.map((token, tIndex) => {
                                                            if (token.type === 'text') return <span key={tIndex}>{token.content}</span>;
                                                            const gapIdx = token.gapIndex;
                                                            const hintText = activeTask.hints && activeTask.hints[gapIdx];
                                                            const clue = (activeTask.gap_clues || [])[gapIdx] || { len: 5, first: '', last2: '' };
                                                            const len = clue.len;
                                                            if ([2, 7].includes(gapIdx)) {
                                                                const options = mcOptions[gapIdx] || [];
                                                                return (
                                                                    <span key={tIndex} className="inline-block mx-1 align-bottom">
                                                                        <span className="relative inline-flex flex-col items-center">
                                                                            <select value={studentAnswers[gapIdx] || ''} onChange={e => handleStudentAnswerChange(gapIdx, e.target.value)} className="w-36 px-2 py-1 text-center border-b-2 border-indigo-500 shadow-sm font-bold text-indigo-800 uppercase outline-none text-sm bg-white rounded-t cursor-pointer">
                                                                                <option value="" disabled>Select...</option>
                                                                                {options.map((opt, i) => <option key={i} value={opt}>{opt}</option>)}
                                                                            </select>
                                                                            {hintText && (<button onClick={() => setUsedHints({...usedHints, [gapIdx]: true})} className="mt-1 text-[10px] bg-amber-100 hover:bg-amber-200 text-amber-900 px-2 py-0.5 font-bold rounded-md whitespace-nowrap flex items-center gap-1 shadow-sm"><Icons.Lightbulb />{usedHints[gapIdx] ? `Hint: ${hintText}` : "Hint (-0.5 pt)"}</button>)}
                                                                        </span>
                                                                    </span>
                                                                );
                                                            } else {
                                                                let ph = `Gap ${gapIdx + 1}`;
                                                                if ([0, 4, 6, 8].includes(gapIdx)) ph = clue.first + ' _'.repeat(Math.max(0, len - 1));
                                                                else if ([1, 3, 5, 9].includes(gapIdx)) ph = '_ '.repeat(Math.max(0, len - 2)) + clue.last2;
                                                                return (
                                                                    <span key={tIndex} className="inline-block mx-1 align-bottom">
                                                                        <span className="relative inline-flex flex-col items-center">
                                                                            <input type="text" placeholder={ph} value={studentAnswers[gapIdx] || ''} onChange={e => handleStudentAnswerChange(gapIdx, e.target.value)} className="px-2 py-1 text-center border-b-2 border-indigo-500 shadow-sm font-bold text-indigo-800 uppercase outline-none text-sm bg-white rounded-t placeholder-slate-400" style={{ width: `${Math.max(7, (studentAnswers[gapIdx] || '').length + 2)}ch` }} />
                                                                            {hintText && (<button onClick={() => setUsedHints({...usedHints, [gapIdx]: true})} className="mt-1 text-[10px] bg-amber-100 hover:bg-amber-200 text-amber-900 px-2 py-0.5 font-bold rounded-md whitespace-nowrap flex items-center gap-1 shadow-sm"><Icons.Lightbulb />{usedHints[gapIdx] ? `Hint: ${hintText}` : "Hint (-0.5 pt)"}</button>)}
                                                                        </span>
                                                                    </span>
                                                                );
                                                            }
                                                        })}
                                                    </p>
                                                </div>
                                            );
                                        })}
                                    </div>
                                    <button onClick={handleEvaluation} disabled={!studentName || !studentEmail || submitting} className={`w-full mt-10 font-bold py-4 rounded-xl shadow-md text-base transition-all ${(studentName && studentEmail && !submitting) ? 'bg-indigo-600 text-white hover:bg-indigo-700' : 'bg-slate-300 text-slate-500 cursor-not-allowed'}`}>{submitting ? 'Submitting...' : 'Submit Audition Assessment'}</button>
                                </div>
                            </div>
                        )}

                        {/* AVISO DE ABANDONO DE PESTAÑA */}
                        {showAwayWarning && (
                            <div className="fixed inset-0 bg-rose-900/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
                                <div className="bg-white rounded-2xl p-8 max-w-lg w-full shadow-2xl border-4 border-rose-500 text-center space-y-4">
                                    <div className="text-5xl">⚠️</div>
                                    <h3 className="text-2xl font-black text-rose-700">Focus Alert!</h3>
                                    <p className="text-slate-700 font-medium">We have detected that you left the task. Remember this is for your own learning.</p>
                                    <p className="text-slate-600 text-sm">You are welcome to review previous auditions in Classroom or use a dictionary (WordReference or DeepL) to look up vocabulary.</p>
                                    <p className="text-rose-700 font-bold bg-rose-50 p-3 rounded-xl text-sm">However, you must not use AI tools to find the answers. This won't help you learn and will only harm your own progress.</p>
                                    <button onClick={() => setShowAwayWarning(false)} className="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3.5 rounded-xl text-sm mt-4">Return to the task</button>
                                </div>
                            </div>
                        )}

                        {view === 'results' && finalScoreRecord && (
                            <div className="max-w-2xl mx-auto bg-white p-8 md:p-10 rounded-3xl shadow-xl border text-center relative overflow-hidden">
                                {(() => {
                                    const feedback = getEnglishFeedback(finalScoreRecord.score);
                                    return (
                                        <div className="relative z-10 space-y-6">
                                            <div>
                                                <div className="w-20 h-20 bg-indigo-50 rounded-full flex items-center justify-center mx-auto mb-4 border-4 border-white shadow-sm"><span className="text-4xl">🎓</span></div>
                                                <h2 className="text-3xl font-extrabold text-slate-900 mb-1">Assessment Submitted</h2>
                                                <p className="text-xs text-slate-400">{finalScoreRecord.student_name} ({finalScoreRecord.student_class})</p>
                                            </div>
                                            <div className="bg-white border-2 border-indigo-50 px-8 py-6 rounded-3xl inline-block mx-auto shadow-sm">
                                                <span className="block text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-2">FINAL SCORE</span>
                                                <span className="text-7xl font-black text-indigo-600 tracking-tighter">{Number(finalScoreRecord.score).toFixed(1)} <span className="text-3xl text-slate-300 font-medium">/ 10</span></span>
                                            </div>
                                            <div className="bg-gradient-to-br from-indigo-50 to-slate-50 border border-indigo-100 p-6 rounded-2xl text-left shadow-sm">
                                                <span className="text-[10px] font-extrabold uppercase tracking-wider text-indigo-500 block mb-1">Pedagogy Evaluation</span>
                                                <h4 className="text-lg font-bold text-indigo-950 mb-1">{feedback.title}</h4>
                                                <p className="text-slate-600 text-sm leading-relaxed">{feedback.text}</p>
                                            </div>
                                            <div className="bg-amber-50 border border-amber-200 p-4 rounded-2xl text-left space-y-2">
                                                <h4 className="font-bold text-amber-900 text-xs flex items-center gap-1.5 uppercase tracking-wide"><Icons.Camera /> Submit to Google Classroom</h4>
                                                <p className="text-amber-800 text-xs leading-relaxed">Please attach <strong>a screenshot of this screen</strong> and <strong>the downloaded PDF diploma</strong> to your Google Classroom assignment as proof of completion.</p>
                                            </div>
                                            <div className="text-left bg-slate-50 p-6 rounded-2xl border space-y-4">
                                                <h4 className="font-bold text-slate-800 text-sm">Gap Results Summary</h4>
                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                                    {finalScoreRecord.details.words.map((item, idx) => (
                                                        <div key={idx} className={`p-3 rounded-xl border flex justify-between items-center text-xs font-semibold ${item.correct ? 'bg-emerald-50/60 border-emerald-200 text-emerald-800' : 'bg-rose-50/60 border-rose-200 text-rose-800'}`}>
                                                            <span>Gap {idx + 1}: {item.correct ? (item.usedHint ? "Correct (with hint)" : "Correct") : "Incorrect"}</span>
                                                            <span className="font-mono bg-white px-2 py-1 rounded shadow-sm border text-slate-700">{item.correct ? item.original : `${item.answer || '(empty)'}`}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                            <div className="space-y-3 pt-2">
                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                                    <button onClick={() => generatePDF(finalScoreRecord)} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl text-sm flex items-center justify-center gap-2 shadow-md"><Icons.Download /> Download Diploma PDF</button>
                                                    <a href="https://classroom.google.com" target="_blank" className="w-full bg-white border font-bold py-3.5 rounded-xl text-sm flex items-center justify-center gap-2 text-slate-700 shadow-sm hover:bg-slate-50"><Icons.External /> Open Google Classroom</a>
                                                </div>
                                            </div>
                                            <div className="pt-2 border-t flex justify-between items-center text-xs text-slate-400">
                                                <button onClick={fetchHistoryAndScores} className="hover:text-slate-600 flex items-center gap-1"><Icons.Refresh /> Check Status Update</button>
                                                <button onClick={() => { setExamSubmitted(false); setView('student-test'); }} className="hover:text-slate-600">Back to Task View</button>
                                            </div>
                                        </div>
                                    );
                                })()}
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
