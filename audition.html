    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        // Default Supabase Cloud Connection Credentials
        const DEFAULT_SUPABASE_PROJECT_ID = "bbdvflbykohleyctiinj";
        const DEFAULT_SUPABASE_URL = `https://${DEFAULT_SUPABASE_PROJECT_ID}.supabase.co`;
        const DEFAULT_SUPABASE_KEY = "sb_publishable_URQ87m7Tiq96RUHGtvX29Q_lYroaqM4";

        const decodeTaskData = (encoded) => {
            try { return JSON.parse(decodeURIComponent(atob(encoded))); } catch (e) { return null; }
        };

        const getStoredAuditions = () => { try { return JSON.parse(localStorage.getItem('audition_app_tasks') || '[]'); } catch (e) { return []; } };
        const saveStoredAuditions = (newList) => { try { localStorage.setItem('audition_app_tasks', JSON.stringify(newList)); } catch (e) {} };
        const getStoredScores = () => { try { return JSON.parse(localStorage.getItem('audition_app_scores') || '[]'); } catch (e) { return []; } };
        const saveStoredScores = (newList) => { try { localStorage.setItem('audition_app_scores', JSON.stringify(newList)); } catch (e) {} };

        // ============================================================
        // HELPERS DE URL — clave para que el enlace del alumno funcione
        // ============================================================
        const getTaskCodeFromUrl = () => {
            try {
                const params = new URLSearchParams(window.location.search);
                const code = params.get('task');
                if (code) return code;
                // Compatibilidad con el esquema antiguo #task/...
                const hash = window.location.hash || '';
                if (hash.startsWith('#task/')) return hash.replace('#task/', '');
            } catch (e) {}
            return null;
        };

        const buildStudentUrl = (code) => {
            const base = `${window.location.origin}${window.location.pathname}`;
            return `${base}?task=${encodeURIComponent(code)}`;
        };
        
        const saveStudentSubmission = (record) => {
            try {
                const list = getStoredScores();
                const filtered = list.filter(r => !(r.student_email?.toLowerCase() === record.student_email?.toLowerCase() && r.audition_id === record.audition_id));
                localStorage.setItem('audition_app_scores', JSON.stringify([record, ...filtered]));
            } catch (e) {}
        };

        const extractYouTubeId = (url) => {
            if (!url) return null;
            const trimmed = String(url).trim();
            if (!trimmed) return null;
            if (/^[a-zA-Z0-9_-]{11}$/.test(trimmed)) return trimmed;
            const regExp = /(?:https?:\/\/)?(?:[a-zA-Z0-9-]+\.)?(?:youtube(?:-nocookie)?\.com\/(?:[^\/\n\s]+\/\S+\/|(?:v|e(?:mbed)?|shorts|live)\/|\S*?[?&]v=)|youtu\.be\/)([a-zA-Z0-9_-]{11})/;
            const match = trimmed.match(regExp);
            return match ? match[1] : null;
        };

        const getEnglishFeedback = (score) => {
            const num = Number(score);
            if (num >= 9) return { title: "Outstanding Achievement! 🌟", text: "Exceptional listening comprehension and terminology precision. Excellent musical ear!" };
            if (num >= 7) return { title: "Great Work! 👍", text: "Solid understanding of the audition piece. Keep practicing your musical vocabulary!" };
            if (num >= 5) return { title: "Satisfactory Performance 🎵", text: "Good effort! Review the musical terms and re-listen to improve gap accuracy." };
            return { title: "Needs Revision 📚", text: "Try re-listening carefully with focused attention on the key vocabulary words." };
        };

        const getQRBase64 = async (text) => {
            if (window.QRCode && typeof window.QRCode.toDataURL === 'function') {
                try {
                    return await window.QRCode.toDataURL(text, { margin: 1, width: 200 });
                } catch (e) {
                    return null;
                }
            }
            return null;
        };

        const playAudioFeedback = (type, score = 10) => {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const now = ctx.currentTime;
                const numScore = Number(score);

                if (type === 'success' && numScore >= 8) {
                    const notes = [
                        { f: 523.25, t: 0.0, d: 0.15 }, { f: 659.25, t: 0.12, d: 0.15 },
                        { f: 783.99, t: 0.24, d: 0.15 }, { f: 1046.50, t: 0.36, d: 0.30 },
                        { f: 783.99, t: 0.60, d: 0.15 }, { f: 1046.50, t: 0.72, d: 0.18 },
                        { f: 1318.51, t: 0.90, d: 0.22 }, { f: 1567.98, t: 1.12, d: 0.50 }
                    ];
                    notes.forEach((note) => {
                        const osc = ctx.createOscillator(); const gain = ctx.createGain();
                        osc.type = 'triangle'; osc.frequency.setValueAtTime(note.f, now + note.t);
                        gain.gain.setValueAtTime(0.18, now + note.t);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + note.t + note.d);
                        osc.connect(gain); gain.connect(ctx.destination);
                        osc.start(now + note.t); osc.stop(now + note.t + note.d);
                    });
                } else if (type === 'success' && numScore >= 5) {
                    const arpeggio = [
                        { f: 392.00, t: 0.00, d: 0.20 }, { f: 493.88, t: 0.15, d: 0.20 },
                        { f: 587.33, t: 0.30, d: 0.20 }, { f: 493.88, t: 0.45, d: 0.20 },
                        { f: 392.00, t: 0.60, d: 0.20 }, { f: 493.88, t: 0.75, d: 0.20 },
                        { f: 587.33, t: 0.90, d: 0.20 }, { f: 392.00, t: 1.10, d: 0.45 }
                    ];
                    arpeggio.forEach((note) => {
                        const osc = ctx.createOscillator(); const gain = ctx.createGain();
                        osc.type = 'sine'; osc.frequency.setValueAtTime(note.f, now + note.t);
                        gain.gain.setValueAtTime(0.15, now + note.t);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + note.t + note.d);
                        osc.connect(gain); gain.connect(ctx.destination);
                        osc.start(now + note.t); osc.stop(now + note.t + note.d);
                    });
                } else {
                    const suspenseSequence = [
                        { f: 246.94, t: 0.00, d: 0.30 }, { f: 233.08, t: 0.28, d: 0.30 },
                        { f: 220.00, t: 0.56, d: 0.45 }, { f: 110.00, t: 1.05, d: 0.35 },
                        { f: 233.08, t: 1.45, d: 0.35 }, { f: 220.00, t: 1.78, d: 0.35 },
                        { f: 207.65, t: 2.11, d: 0.60 }
                    ];
                    suspenseSequence.forEach((note) => {
                        const osc = ctx.createOscillator(); const gain = ctx.createGain();
                        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(note.f, now + note.t);
                        gain.gain.setValueAtTime(0.14, now + note.t);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + note.t + note.d);
                        osc.connect(gain); gain.connect(ctx.destination);
                        osc.start(now + note.t); osc.stop(now + note.t + note.d);
                    });
                }
            } catch(e) {}
        };

        const Icons = {
            Sparkles: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" /></svg>,
            Speaker: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M11 5L6 9H2v6h4l5 4V5z" /></svg>,

            Download: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>,
            External: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" /></svg>,
            LogOut: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>,
            Trash: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>,
            Copy: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>,
            Check: () => <svg className="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" /></svg>,
            Eye: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path strokeLinecap="round" strokeLinejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>,
            Search: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>,
            Link: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1" /></svg>,
            Lightbulb: () => <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9.663 17h4.673M12 3a7 7 0 00-7 7c0 2.38 1.19 4.485 3 5.74V17a1 1 0 001 1h6a1 1 0 001-1v-1.26c1.81-1.255 3-3.36 3-5.74a7 7 0 00-7-7z" /></svg>,
            Refresh: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>,
            Camera: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" /><circle cx="12" cy="13" r="3" /></svg>,
            Database: () => <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4" /></svg>
        };

        const App = () => {
            // ------------------------------------------------------------
            // MODO ALUMNO PRIORITARIO: si hay ?task= en la URL, ignoramos
            // cualquier sesión de profesor guardada y entramos directo.
            // ------------------------------------------------------------
            const initialTaskCode = getTaskCodeFromUrl();
            const [view, setView] = useState(initialTaskCode ? 'student-test' : 'auth');
            const [session, setSession] = useState(null);
            const [loading, setLoading] = useState(true);
            const [dashboardTab, setDashboardTab] = useState('create');
            
            const [supabaseUrl] = useState(DEFAULT_SUPABASE_URL);
            const [supabaseKey] = useState(DEFAULT_SUPABASE_KEY);
            const [supabaseClient, setSupabaseClient] = useState(null);

            const [authEmail, setAuthEmail] = useState('');
            const [toast, setToast] = useState(null);
            const [confirmModal, setConfirmModal] = useState(null);
            const [createdTaskModal, setCreatedTaskModal] = useState(null);
            const [lookupModal, setLookupModal] = useState(false);
            const [lookupEmail, setLookupEmail] = useState('');

            const [title, setTitle] = useState('');
            const [artist, setArtist] = useState('');
            const [style, setStyle] = useState('Classical');
            const [youtubeUrl, setYoutubeUrl] = useState('');
            const [commentText, setCommentText] = useState('');
            const [taskHints, setTaskHints] = useState(Array(10).fill(''));
            
            const [auditionsList, setAuditionsList] = useState([]);
            const [scoresList, setScoresList] = useState([]);
            const [searchTerm, setSearchTerm] = useState('');
            const [copiedId, setCopiedId] = useState(null);
            const [selectedScoreDetails, setSelectedScoreDetails] = useState(null);

            const [activeTask, setActiveTask] = useState(null);
            const [studentName, setStudentName] = useState('');
            const [studentClass, setStudentClass] = useState('2º ESO A');
            const [studentEmail, setStudentEmail] = useState('');
            const [studentAnswers, setStudentAnswers] = useState({});
            const [usedHints, setUsedHints] = useState({}); 
            const [finalScoreRecord, setFinalScoreRecord] = useState(null);
            const [examSubmitted, setExamSubmitted] = useState(false);
            
            const [mcOptions, setMcOptions] = useState({});
            const [speakingIndex, setSpeakingIndex] = useState(null);

            const showToast = (message, type = 'info') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 4000);
            };

            const copyToClipboard = (text) => {
                const tempInput = document.createElement("input");
                tempInput.value = text;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand("copy");
                document.body.removeChild(tempInput);
            };

            useEffect(() => {
                if (supabaseUrl && supabaseKey && window.supabase) {
                    try {
                        const client = window.supabase.createClient(supabaseUrl, supabaseKey);
                        setSupabaseClient(client);
                    } catch (e) {
                        console.error("Supabase init error:", e);
                        setSupabaseClient(null);
                    }
                }
            }, [supabaseUrl, supabaseKey]);

            const toggleSpeech = (text, index) => {
                if ('speechSynthesis' in window) {
                    if (speakingIndex === index) {
                        window.speechSynthesis.cancel();
                        setSpeakingIndex(null);
                    } else {
                        window.speechSynthesis.cancel();
                        const cleanText = text.replace(/[A-ZÁÉÍÓÚÑ]{2,}/g, (m) => m.toLowerCase());
                        const utterance = new SpeechSynthesisUtterance(cleanText);
                        utterance.lang = 'en-US'; utterance.rate = 0.9;
                        const voices = window.speechSynthesis.getVoices();
                        const englishVoice = voices.find(v => v.lang.startsWith('en-US') || v.lang.startsWith('en-GB') || v.lang.startsWith('en'));
                        if (englishVoice) utterance.voice = englishVoice;
                        utterance.onend = () => setSpeakingIndex(null);
                        utterance.onerror = () => setSpeakingIndex(null);
                        setSpeakingIndex(index);
                        window.speechSynthesis.speak(utterance);
                    }
                } else {
                    showToast("Speech synthesis is not available in your browser.", "error");
                }
            };

            // ------------------------------------------------------------
            // CARGA DE TAREA DEL ALUMNO
            // Prioridad: Supabase -> datos embebidos -> localStorage
            // NUNCA cae al dashboard del profesor si hay ?task= en la URL.
            // ------------------------------------------------------------
            const loadStudentTask = async (code) => {
                if (!code) return;
                setLoading(true);
                let taskData = null;

                if (supabaseUrl && supabaseKey && window.supabase) {
                    try {
                        const tempClient = window.supabase.createClient(supabaseUrl, supabaseKey);
                        const { data, error } = await tempClient.from('auditions').select('*').eq('id', code).maybeSingle();
                        if (data && !error) taskData = data;
                    } catch (e) {
                        console.error("Supabase fetch task error:", e);
                    }
                }

                if (!taskData) {
                    // Intentar decodificar datos embebidos en el propio código
                    taskData = decodeTaskData(code);
                }

                if (!taskData) {
                    const localAuditions = getStoredAuditions();
                    taskData = localAuditions.find(a => a.share_link === code || a.id === code);
                }

                if (taskData) {
                    setActiveTask(taskData);
                    setExamSubmitted(false);
                    setFinalScoreRecord(null);
                    setView('student-test');
                } else {
                    showToast("Task link not found. Please ask your teacher for a new link.", "error");
                    // Nos quedamos en student-test pero sin tarea -> mostramos aviso
                    setActiveTask(null);
                    setView('student-test');
                }
                setLoading(false);
            };

            useEffect(() => {
                const checkSession = () => {
                    const savedSession = localStorage.getItem('audition_app_teacher_session');
                    if (savedSession) setSession(JSON.parse(savedSession));
                    setLoading(false);
                };
                checkSession();
            }, []);

            // Cargar tarea del alumno SOLO una vez al arrancar, si hay ?task= o #task/
            useEffect(() => {
                const code = getTaskCodeFromUrl();
                if (code) {
                    // Si venía del esquema antiguo #task/, reescribimos la URL a ?task= para estabilidad
                    if (window.location.hash && window.location.hash.startsWith('#task/')) {
                        try {
                            window.history.replaceState(null, '', buildStudentUrl(code));
                        } catch (e) {}
                    }
                    loadStudentTask(code);
                }
                // eslint-disable-next-line
            }, []);

            // Redirigir al dashboard del profesor SOLO si NO hay tarea en la URL
            useEffect(() => {
                const code = getTaskCodeFromUrl();
                if (!code && session && (view === 'auth')) {
                    setView('dashboard');
                }
            }, [session, view]);

            // Si NO hay tarea en la URL y el usuario navega atrás, gestionar # antiguo
            useEffect(() => {
                const handleHashChange = () => {
                    const hash = window.location.hash || '';
                    if (hash.startsWith('#task/')) {
                        const code = hash.replace('#task/', '');
                        try {
                            window.history.replaceState(null, '', buildStudentUrl(code));
                        } catch (e) {}
                        loadStudentTask(code);
                    }
                };
                window.addEventListener('hashchange', handleHashChange);
                return () => window.removeEventListener('hashchange', handleHashChange);
                // eslint-disable-next-line
            }, []);

            useEffect(() => {
                if (activeTask && activeTask.uppercase_words && view === 'student-test' && !examSubmitted) {
                    const words = activeTask.uppercase_words.map(w => w.replace(/[^A-Za-zA-ZÁÉÍÓÚÑáéíóúñ]/g, '').toUpperCase());
                    const newMcOptions = {};
                    [2, 7].forEach(idx => {
                        if (words[idx]) {
                            const correct = words[idx];
                            const distractors = words.filter((w, i) => i !== idx);
                            distractors.sort(() => 0.5 - Math.random());
                            const options = [correct, distractors[0], distractors[1]].filter(Boolean).sort(() => 0.5 - Math.random());
                            newMcOptions[idx] = options;
                        }
                    });
                    setMcOptions(newMcOptions);
                }
            }, [activeTask, view, examSubmitted]);

            const handleTeacherAuth = (e) => {
                e.preventDefault();
                const normalizedEmail = (authEmail || 'teacher@school.edu').toLowerCase().trim();
                const userSession = { user: { id: normalizedEmail, email: normalizedEmail } };
                localStorage.setItem('audition_app_teacher_session', JSON.stringify(userSession));
                setSession(userSession);
                setView('dashboard');
                showToast(`Signed in as ${normalizedEmail}`, "success");
            };

            const handleLogout = () => {
                localStorage.removeItem('audition_app_teacher_session');
                setSession(null); setView('auth');
                showToast("Signed out.", "info");
            };

            const videoId = useMemo(() => extractYouTubeId(youtubeUrl), [youtubeUrl]);
            const uppercaseWords = useMemo(() => commentText.match(/[A-ZÁÉÍÓÚÑ]{2,}/g) || [], [commentText]);

            const handleHintChange = (idx, value) => {
                const newHints = [...taskHints]; newHints[idx] = value; setTaskHints(newHints);
            };

            const handlePublishTask = async () => {

                if (!activeTask?.comment) return [];
                let gapCounter = 0;
                const paragraphs = activeTask.comment.split('\n');
                return paragraphs.map((paragraphText) => {
                    if (!paragraphText.trim()) return [];
                    const tokens = []; const regex = /([A-ZÁÉÍÓÚÑ]{2,})/g;
                    let lastIdx = 0; let match;
                    while ((match = regex.exec(paragraphText)) !== null) {
                        if (match.index > lastIdx) tokens.push({ type: 'text', content: paragraphText.slice(lastIdx, match.index) });
                        tokens.push({ type: 'gap', word: match[0], gapIndex: gapCounter++ });
                        lastIdx = regex.lastIndex;
                    }
                    if (lastIdx < paragraphText.length) tokens.push({ type: 'text', content: paragraphText.slice(lastIdx) });
                    return tokens;
                });

                    const isCorrect = studentAns === cleanWord;

                    if (isCorrect) earnedPoints = usedHint ? 0.5 : 1.0;

                templateText = templateText.replace(/([A-ZÁÉÍÓÚÑ]{2,})/g, (match) => {
                    const idx = gapCounter++;
                    const cleanWord = match.replace(/[^A-Za-zA-ZÁÉÍÓÚÑáéíóúñ]/g, '').toUpperCase();
                    const len = cleanWord.length;
                    
                    if ([0, 4, 6, 8].includes(idx)) {
                        return cleanWord.charAt(0) + ' _'.repeat(len - 1);
                    } else if ([1, 3, 5, 9].includes(idx)) {
                        return '_ '.repeat(len > 2 ? len - 2 : 0) + cleanWord.slice(-2);
                    } else if ([2, 7].includes(idx)) {
                        const dist = wordsArray.filter(w => w !== cleanWord);
                        dist.sort(() => 0.5 - Math.random());
                        const opts = [cleanWord, dist[0], dist[1]].filter(Boolean).sort(() => 0.5 - Math.random());
                        return `[ ${opts.join(' / ')} ]`;
                    }
                    return match;
                });

                                                <p className="text-xs text-slate-400">{finalScoreRecord.student_name} ({finalScoreRecord.student_class})</p>
                                            </div>

                                            <div className="bg-white border-2 border-indigo-50 px-8 py-6 rounded-3xl inline-block mx-auto shadow-sm">
                                                <span className="block text-[11px] font-bold text-slate-400 uppercase tracking-widest mb-2">FINAL SCORE</span>
                                                <span className="text-7xl font-black text-indigo-600 tracking-tighter">{Number(finalScoreRecord.score).toFixed(1)} <span className="text-3xl text-slate-300 font-medium">/ 10</span></span>
                                            </div>

                                            <div className="bg-gradient-to-br from-indigo-50 to-slate-50 border border-indigo-100 p-6 rounded-2xl text-left shadow-sm">
                                                <span className="text-[10px] font-extrabold uppercase tracking-wider text-indigo-500 block mb-1">Pedagogy Evaluation</span>
                                                <h4 className="text-lg font-bold text-indigo-950 mb-1">{feedback.title}</h4>
                                                <p className="text-slate-600 text-sm leading-relaxed">{feedback.text}</p>
                                            </div>

                                            <div className="bg-amber-50 border border-amber-200 p-4 rounded-2xl text-left space-y-2">
                                                <h4 className="font-bold text-amber-900 text-xs flex items-center gap-1.5 uppercase tracking-wide"><Icons.Camera /> Take a Screenshot for Google Classroom</h4>
                                                <p className="text-amber-800 text-xs leading-relaxed">Please take a screenshot of this window and attach it to your Google Classroom assignment as proof of completion.</p>
                                            </div>

                                            <div className="text-left bg-slate-50 p-6 rounded-2xl border space-y-4">
                                                <h4 className="font-bold text-slate-800 text-sm">Gap Results Summary</h4>
                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                                    {finalScoreRecord.details.words.map((item, idx) => (
                                                        <div key={idx} className={`p-3 rounded-xl border flex justify-between items-center text-xs font-semibold ${item.correct ? 'bg-emerald-50/60 border-emerald-200 text-emerald-800' : 'bg-rose-50/60 border-rose-200 text-rose-800'}`}>
                                                            <span>Gap {idx + 1}: {item.correct ? (item.usedHint ? "✓ Correct (with hint)" : "✓ Correct") : "✗ Incorrect"}</span>
                                                            <span className="font-mono bg-white px-2 py-1 rounded shadow-sm border text-slate-700">{item.correct ? item.original : `${item.answer || '(empty)'}`}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>

                                            <div className="space-y-3 pt-2">
                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                                    <button onClick={() => generatePDF(finalScoreRecord)} className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl text-sm flex items-center justify-center gap-2 shadow-md shadow-indigo-100 transition-all"><Icons.Download /> Download Diploma PDF</button>
                                                    <a href="https://classroom.google.com" target="_blank" className="w-full bg-white border font-bold py-3.5 rounded-xl text-sm flex items-center justify-center gap-2 text-slate-700 shadow-sm hover:bg-slate-50 transition-all"><Icons.External /> Open Google Classroom</a>
                                                </div>
                                            </div>

                                            <div className="pt-2 border-t flex justify-between items-center text-xs text-slate-400">
                                                <button onClick={fetchHistoryAndScores} className="hover:text-slate-600 flex items-center gap-1"><Icons.Refresh /> Check Status Update</button>
                                                <button onClick={() => { setExamSubmitted(false); setView('student-test'); }} className="hover:text-slate-600">Back to Task View</button>
                                            </div>
                                        </div>
                                    );
                                })()}
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
